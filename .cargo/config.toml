# Variáveis que o cargo coloca no ambiente de `cargo run` e `cargo test`.
# Uma variável já definida no terminal vence a daqui.
[env]
DATABASE_URL = "postgres://mothh:mothh@127.0.0.1:5440/mothh"
# LiveKit do `docker compose up -d` (F2-01). Só para desenvolvimento.
MOTHH_LIVEKIT_URL = "ws://127.0.0.1:7880"
MOTHH_LIVEKIT_KEY = "devkey"
MOTHH_LIVEKIT_SECRET = "mothh-livekit-dev-secret-nao-usar-em-prod"
# O webrtc-sys compila com NTDDI_VERSION=NTDDI_WIN11_GE, nome que só existe no
# Windows SDK 10.0.26100+. Com um SDK mais velho o build quebra em
# FILE_INFO_BY_HANDLE_CLASS; definir o nome aqui (mesmo valor do SDK novo)
# deixa compilar em qualquer um. Só vale para o alvo Windows.
CXXFLAGS_x86_64_pc_windows_msvc = "/DNTDDI_WIN11_GE=0x0A000010"

# O libwebrtc pré-compilado do LiveKit (chamadas, F2-03) usa o runtime C++
# estático (/MT). Sem isto o Windows linka /MD e dá "mismatch detected for
# 'RuntimeLibrary'".
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
