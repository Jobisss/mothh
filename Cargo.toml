[workspace]
resolver = "3"
members = ["crates/protocol", "crates/server", "crates/client", "crates/crypto"]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "UNLICENSED"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
crypto = { path = "crates/crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.5"
sha2 = "0.10"
opus-pure = "0.2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "migrate", "macros"] }

# O argon2 é lento de propósito; sem otimização (perfil dev) cada hash leva
# segundos e os testes se arrastam. Só essas crates são compiladas otimizadas.
[profile.dev.package.argon2]
opt-level = 3

# O mesmo para o codec Opus: sem otimização, codificar alguns segundos de
# áudio já demora perceptivelmente.
[profile.dev.package.opus-pure]
opt-level = 3
