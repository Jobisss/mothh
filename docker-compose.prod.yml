services:
  # Na VPS de hoje quem atende 80/443 é o nginx do sistema, que repassa
  # mothh.joaoschianti.com para 127.0.0.1:3006 e livekit.mothh para
  # 127.0.0.1:3007 (portas abaixo). O Caddy só sobe numa VPS sem outro proxy:
  # `docker compose -f docker-compose.prod.yml --profile caddy up -d`.
  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server
      - livekit

  server:
    build: .
    restart: unless-stopped
    env_file: .env.prod
    environment:
      MOTHH_ENDERECO: 0.0.0.0:3000
      MOTHH_ANEXOS: /var/lib/mothh/anexos
    # Só para o nginx da própria VPS; não fica aberta na internet.
    ports:
      - "127.0.0.1:3006:3000"
    volumes:
      - mothh-anexos:/var/lib/mothh/anexos
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_USER: mothh
      POSTGRES_DB: mothh
    volumes:
      - mothh-pg-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mothh -d mothh"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Chamadas de voz, vídeo e tela. A sinalização passa pelo Caddy
  # (livekit.mothh.joaoschianti.com); a mídia usa as portas abaixo direto.
  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    env_file: .env.prod
    # Monta LIVEKIT_KEYS a partir do mesmo par que o servidor usa para gerar tokens.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'LIVEKIT_KEYS="$$MOTHH_LIVEKIT_KEY: $$MOTHH_LIVEKIT_SECRET" exec /livekit-server --config /etc/livekit.yaml'
    ports:
      # Sinalização, só para o nginx da própria VPS.
      - "127.0.0.1:3007:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "3478:3478/udp"
    volumes:
      - ./infra/livekit/livekit.prod.yaml:/etc/livekit.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7880 | grep -q OK"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  caddy-data:
  caddy-config:
  mothh-anexos:
  mothh-pg-prod:
