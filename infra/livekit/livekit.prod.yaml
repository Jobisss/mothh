# LiveKit na VPS (docker-compose.prod.yml). As chaves vêm de LIVEKIT_KEYS no .env.prod.
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  # Quando a rede de quem assiste não dá conta, o LiveKit baixa a camada da
  # tela/câmera e, no limite, pausa o vídeo em vez de deixar a voz parar de
  # chegar (allow_pause vem desligado por padrão).
  congestion_control:
    enabled: true
    allow_pause: true
  # Descobre o IP público da VPS por STUN e anuncia esse IP aos apps.
  use_external_ip: true
turn:
  enabled: true
  udp_port: 3478
logging:
  level: info
