# Protótipo da Fase 3: corpo + peças modulares + rosto por textura.
# Fica fora do workspace de propósito (o Bevy é pesado e não entra no app ainda).
# Rodar:  cd tools/avatar-lab && cargo run --release
[package]
name = "avatar-lab"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["default_app", "std", "multi_threaded", "bevy_winit", "x11", "3d_bevy_render", "scene", "png"] }

[profile.dev.package."*"]
opt-level = 2
