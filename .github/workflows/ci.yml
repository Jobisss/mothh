name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validar opções compartilhadas do extrator
        run: python3 -m unittest discover -s infra/music -p 'test_*.py'
      - name: Construir servidor e worker na imagem de produção
        run: docker build -t mothh-server-ci .
      - name: Conferir dependências como usuário de produção
        run: |
          docker run --rm --entrypoint sh mothh-server-ci -ec '
            test "$(id -u)" = 10001
            /opt/yt-dlp/bin/yt-dlp --version
            /opt/yt-dlp/bin/python -c "import yt_dlp_ejs"
            /opt/yt-dlp/bin/python -c "from importlib.metadata import version; assert version(\"bgutil-ytdlp-pot-provider\") == \"2.0.2\""
            /usr/local/bin/mothh-yt-dlp --version
            ffmpeg -version
            deno --version
            ! ldd /usr/local/bin/music-worker | grep "not found"
            /usr/local/bin/music-worker </dev/null
          '
      - name: Conferir comunicação com o provedor interno
        run: |
          docker network create mothh-pot-ci
          docker run -d --name music-pot --network mothh-pot-ci --init brainicism/bgutil-ytdlp-pot-provider:2.0.2
          docker run --rm --network mothh-pot-ci --entrypoint /usr/bin/python3 mothh-server-ci -c '
          import json, time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://music-pot:4416/ping", timeout=2) as response:
                      assert json.load(response)["version"] == "2.0.2"
                  break
              except (OSError, ValueError):
                  if attempt == 29:
                      raise
                  time.sleep(1)
          '
      - name: Encerrar provedor de teste
        if: always()
        run: |
          docker rm -f music-pot || true
          docker network rm mothh-pot-ci || true

  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mothh
          POSTGRES_PASSWORD: mothh
          POSTGRES_DB: mothh
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U mothh"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://mothh:mothh@127.0.0.1:5440/mothh
    steps:
      - uses: actions/checkout@v7
      - name: Bibliotecas de áudio e janela
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev libxkbcommon-dev libglib2.0-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MOTHH_DEFAULT_SERVIDOR: wss://mothh.joaoschianti.com/ws
    steps:
      - uses: actions/checkout@v7
      - name: Bibliotecas Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev libxkbcommon-dev libglib2.0-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p client --release
      - name: Gerar instalador do Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\mothh.iss'
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: mothh-installer-windows-x64
          path: dist/mothh-setup-windows-x64.exe
          if-no-files-found: error
