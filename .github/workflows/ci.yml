name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mothh
          POSTGRES_PASSWORD: mothh
          POSTGRES_DB: mothh
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U mothh"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://mothh:mothh@127.0.0.1:5440/mothh
    steps:
      - uses: actions/checkout@v7
      - name: Bibliotecas de áudio e janela
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev libxkbcommon-dev libglib2.0-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MOTHH_DEFAULT_SERVIDOR: wss://mothh.joaoschianti.com/ws
    steps:
      - uses: actions/checkout@v7
      - name: Bibliotecas Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev libxkbcommon-dev libglib2.0-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p client --release
      - name: Criar ícone do instalador
        if: runner.os == 'Windows'
        shell: pwsh
        run: magick assets/logo-temporaria.png -define icon:auto-resize=256,128,64,48,32,16 installer/mothh.ico
      - name: Gerar instalador do Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\mothh.iss'
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: mothh-installer-windows-x64
          path: dist/mothh-setup-windows-x64.exe
          if-no-files-found: error
