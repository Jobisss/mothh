# Banco de dados para desenvolvimento: `docker compose up -d`.
# A porta 5440 evita brigar com um PostgreSQL já instalado na máquina (5432).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mothh
      POSTGRES_PASSWORD: mothh
      POSTGRES_DB: mothh
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - mothh-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mothh"]
      interval: 2s
      retries: 15

volumes:
  mothh-pg:
