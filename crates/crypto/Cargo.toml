[package]
name = "crypto"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
chacha20poly1305 = "0.10"
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native", "async-secret-service", "tokio", "crypto-rust"] }
openmls = "0.9.2"
openmls_basic_credential = "0.6.0"
openmls_memory_storage = { version = "0.6.0", features = ["persistence"] }
openmls_rust_crypto = "0.6.0"
openmls_traits = "0.6.0"
serde_json.workspace = true
thiserror = "2.0.21"
tls_codec = "0.5.0"
tokio = { version = "1", features = ["rt"] }
