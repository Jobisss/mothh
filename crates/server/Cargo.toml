[package]
name = "server"
description = "Servidor do mothh: login, conversas e mensagens via WebSocket."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
protocol.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { version = "0.8", features = ["ws"] }
sqlx.workspace = true
argon2.workspace = true
sha2.workspace = true
opus-pure.workspace = true
serde.workspace = true
# Só HMAC-SHA256 em Rust puro, sem dependência em C (compila igual no Windows).
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
uuid.workspace = true
reqwest = { version = "0.12", default-features = false }
tokio-tungstenite.workspace = true
