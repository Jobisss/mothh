[package]
name = "client"
description = "App desktop do mothh, com interface em Slint."
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "mothh"
path = "src/main.rs"

[dependencies]
protocol.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
slint = "1"
dirs = "6"
cpal = "0.18"
opus-pure.workspace = true
# Só HTTP simples por enquanto, para os anexos; o HTTPS entra junto com o
# `wss://` (F1-17).
reqwest = { version = "0.12", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[build-dependencies]
slint-build = "1"

[dev-dependencies]
uuid.workspace = true
