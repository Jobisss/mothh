[package]
name = "client"
description = "App desktop do mothh, com interface em Slint."
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "mothh"
path = "src/main.rs"

[dependencies]
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
glam = "0.33"
uuid.workspace = true
protocol.workspace = true
crypto.workspace = true
serde_json.workspace = true
serde.workspace = true
# Miniatura da prévia de link dentro da mensagem cifrada (`links.rs`).
base64 = "0.22"
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
futures-util.workspace = true
# `unstable-winit-030`: acesso à janela do winit para a barra própria
# (arrastar e mudar o tamanho da janela sem moldura, em `title_bar.rs`).
slint = { version = "1", features = ["unstable-winit-030"] }
dirs = "6"
cpal = "0.16"
opus-pure.workspace = true
# Confere o instalador baixado pela atualização automática (`update.rs`).
sha2.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rodio = { version = "0.21", default-features = false, features = ["playback"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Ctrl+V no campo do chat: imagem ou arquivos copiados viram anexo.
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
# Chamada de voz (F2-03). Versões presas de propósito: a partir do webrtc-sys
# 0.3.43 o build no Linux exige clang 21, que não vem no Ubuntu nem no runner
# da CI. As crates irmãs do livekit 0.8.3 também ficam presas na versão da
# mesma época, senão o `cargo update` puxa uma que não compila com ele.
livekit = { version = "=0.8.3", default-features = false, features = ["tokio", "rustls-tls-webpki-roots"] }
livekit-api = { version = "=0.6.3", default-features = false }
livekit-common = "=0.1.1"
livekit-data-stream = "=0.1.2"
livekit-datatrack = "=0.1.13"
livekit-protocol = "=0.7.12"
webrtc-sys = "=0.3.42"
# `volume.rs` lê por dentro a faixa de áudio do libwebrtc e do webrtc-sys:
# subir qualquer um dos dois exige conferir o desenho que ele supõe.
libwebrtc = "=0.3.45"
cxx = "1"
# Webcam (F2-05). Sem o `decoding` padrão, que compila o mozjpeg em C: o MJPEG
# da câmera é lido pelo `image`, que já está aqui.
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }
nnnoiseless = { version = "0.5", default-features = false }

# Som da tela compartilhada: o "process loopback" do WASAPI grava o som de um
# programa só, ou de tudo menos o mothh. A `windows` é a mesma versão que o
# `wasapi` usa, só para achar o dono de uma janela.
[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Media_Control", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT"] }

# Ícone da mariposa na bandeja do sistema, com o menu abrir/sair (`tray.rs`).
tray-icon = { version = "0.21", default-features = false }

[build-dependencies]
slint-build = "1"
# Baixa o libwebrtc pré-compilado que combina com o webrtc-sys acima.
webrtc-sys-build = "=0.3.18"
# Compila `cpp/volume.cpp` (volume de cada pessoa na chamada).
cc = "1"

# Põe o ícone (installer/mothh.ico) dentro do mothh.exe, para o Explorer,
# a barra de tarefas e os atalhos mostrarem a mariposa.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
uuid.workspace = true
# Só para o teste da F2-09 gerar tokens de sala direto, sem o servidor.
livekit-api = { version = "=0.6.3", default-features = false, features = ["access-token"] }
