[package]
name = "client"
description = "App desktop do mothh, com interface em Slint."
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "mothh"
path = "src/main.rs"

[dependencies]
protocol.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
futures-util.workspace = true
slint = "1"
dirs = "6"
cpal = "0.16"
opus-pure.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rodio = { version = "0.21", default-features = false, features = ["playback"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[build-dependencies]
slint-build = "1"

[dev-dependencies]
uuid.workspace = true
