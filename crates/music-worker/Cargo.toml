[package]
name = "music-worker"
description = "Publicador de música em sala LiveKit isolada, supervisionado pelo servidor."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
protocol.workspace = true
serde_json.workspace = true
tokio.workspace = true
livekit = { version = "=0.8.3", default-features = false, features = ["tokio", "rustls-tls-webpki-roots"] }
livekit-api = { version = "=0.6.3", default-features = false }
livekit-common = "=0.1.1"
livekit-data-stream = "=0.1.2"
livekit-datatrack = "=0.1.13"
livekit-protocol = "=0.7.12"
webrtc-sys = "=0.3.42"
libwebrtc = "=0.3.45"
